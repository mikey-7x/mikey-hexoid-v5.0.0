name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify structure, branding and licence
        run: python3 tools/verify_repository.py

      - name: Check installer syntax
        run: |
          bash -n mhex.sh
          bash -n mhex_e.sh

      - name: Confirm the installers only add attribution lines
        run: |
          grep -c "POWERED BY \[mikey:hexoid-sys\]" mhex.sh mhex_e.sh
